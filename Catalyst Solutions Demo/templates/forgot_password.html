<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Buff Bison Construction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

    <main class="login-box">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='css/logo.png') }}" alt="Buff Bison Logo" class="login-logo">
            <span class="brand-name">BUFF BISON</span>
            <span class="brand-sub">CONSTRUCTION</span>
        </div>

        <h1>Forgot Password?</h1>
        <p class="login-subtitle">Enter your email address to get help resetting your password.</p>

        {% if error %}
            <p class="login-error">{{ error }}</p>
        {% endif %}
        {% if message %}
            <p class="login-notice">{{ message }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" required autofocus>
            <button type="submit" class="btn login-btn">Continue</button>
            <a href="{{ url_for('login') }}" class="forgot-password">Back to Sign In</a>
        </form>
    </main>

</body>
</html>
