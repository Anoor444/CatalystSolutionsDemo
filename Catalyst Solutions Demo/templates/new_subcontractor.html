<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Subcontractor | Buff Bison Construction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

    <!-- ===== SIDEBAR ===== -->
    {% set active_page = 'subcontractors' %}
    {% include '_sidebar.html' %}

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main">

        <header class="header">
            <div>
                <h1>Add New Subcontractor</h1>
                <p class="welcome">Enter subcontractor information to add them to the system.</p>
            </div>
            <div class="header-right">
                <div class="profile">
                    <span class="avatar">{{ user_name[0] }}</span>
                    <span class="profile-name">{{ user_name }}</span>
                </div>
            </div>
        </header>

        <main class="content">
            <!-- Fields marked required are checked by the browser (HTML5 validation) -->
            <form method="POST" action="{{ url_for('new_subcontractor') }}" class="form-page">

                <!-- Contact information -->
                <section class="card form-section">
                    <h2>Contact Information</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="full_name">Full Name <span class="required">*</span></label>
                            <input type="text" id="full_name" name="full_name" required>
                        </div>
                        <div class="form-field">
                            <label for="company">Company Name <span class="required">*</span></label>
                            <input type="text" id="company" name="company" required>
                        </div>
                        <div class="form-field">
                            <label for="email">Email Address <span class="required">*</span></label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-field">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        <div class="form-field full">
                            <label for="address">Business Address (optional)</label>
                            <input type="text" id="address" name="address">
                        </div>
                    </div>
                </section>

                <!-- Work information -->
                <section class="card form-section">
                    <h2>Work Information</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="trade">Trade/Specialty <span class="required">*</span></label>
                            <select id="trade" name="trade" required>
                                <option value="">Select a trade</option>
                                <option>Electrical</option>
                                <option>Plumbing</option>
                                <option>Roofing</option>
                                <option>Painting</option>
                                <option>Flooring</option>
                                <option>HVAC</option>
                                <option>General Contracting</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="license">License Number (optional)</label>
                            <input type="text" id="license" name="license">
                        </div>
                        <div class="form-field">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option selected>Active</option>
                                <option>Inactive</option>
                            </select>
                        </div>
                        <div class="form-field full">
                            <label for="notes">Notes (optional)</label>
                            <textarea id="notes" name="notes"></textarea>
                        </div>
                    </div>
                </section>

                <!-- Buttons -->
                <div class="form-actions">
                    <a href="{{ url_for('subcontractors') }}" class="btn-outline">Cancel</a>
                    <button type="submit" class="btn">Save Subcontractor</button>
                </div>

            </form>
        </main>
    </div>
</div>
</body>
</html>
