<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Buff Bison Construction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

    <main class="login-box">

        <div class="login-brand">
            <img src="{{ url_for('static', filename='css/logo.png') }}" alt="Buff Bison Logo" class="login-logo">
            <span class="brand-name">BUFF BISON</span>
            <span class="brand-sub">CONSTRUCTION</span>
        </div>

        <h1>Sign In</h1>
        <p class="login-subtitle">Project Management Portal</p>

        <!-- Error message (only shown after a failed login) -->
        {% if error %}
            <p class="login-error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn login-btn">Sign In</button>
            <a href="#" class="forgot-password">Forgot Password?</a>
        </form>

    </main>

</body>
</html>
