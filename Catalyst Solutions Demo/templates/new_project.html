<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project | Buff Bison Construction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

    <!-- ===== SIDEBAR ===== -->
    {% set active_page = 'projects' %}
    {% include '_sidebar.html' %}

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main">

        <header class="header">
            <div>
                <h1>New Project</h1>
                <p class="welcome">Create a new construction project</p>
            </div>
            <div class="header-right">
                <div class="profile">
                    <span class="avatar">{{ user_name[0] }}</span>
                    <span class="profile-name">{{ user_name }}</span>
                </div>
            </div>
        </header>

        <main class="content">
            <!-- Fields marked required are checked by the browser (HTML5 validation) -->
            <form method="POST" action="{{ url_for('new_project') }}" class="form-page">

                <!-- Project information -->
                <section class="card form-section">
                    <h2>Project Information</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="project_name">Project Name <span class="required">*</span></label>
                            <input type="text" id="project_name" name="project_name" required>
                        </div>
                        <div class="form-field">
                            <label for="project_type">Project Type <span class="required">*</span></label>
                            <select id="project_type" name="project_type" required>
                                <option value="">Select a type</option>
                                <option>Kitchen Remodel</option>
                                <option>Bathroom Remodel</option>
                                <option>Roofing</option>
                                <option>Home Addition</option>
                                <option>Full Renovation</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="form-field full">
                            <label for="description">Project Description</label>
                            <textarea id="description" name="description"></textarea>
                        </div>
                    </div>
                </section>

                <!-- Client information -->
                <section class="card form-section">
                    <h2>Client Information</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="client_name">Client Name <span class="required">*</span></label>
                            <input type="text" id="client_name" name="client_name" required>
                        </div>
                        <div class="form-field">
                            <label for="client_email">Client Email</label>
                            <input type="email" id="client_email" name="client_email">
                        </div>
                        <div class="form-field">
                            <label for="client_phone">Client Phone</label>
                            <input type="tel" id="client_phone" name="client_phone">
                        </div>
                        <div class="form-field">
                            <label for="address">Project Address <span class="required">*</span></label>
                            <input type="text" id="address" name="address" required>
                        </div>
                    </div>
                </section>

                <!-- Project management -->
                <section class="card form-section">
                    <h2>Project Management</h2>
                    <div class="form-grid">
                        <div class="form-field full">
                            <label for="manager">Project Manager <span class="required">*</span></label>
                            <select id="manager" name="manager" required>
                                <option value="">Select a project manager</option>
                                <option>Daniel Carter</option>
                                <option>James Wilson</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="start_date">Start Date</label>
                            <input type="date" id="start_date" name="start_date">
                        </div>
                        <div class="form-field">
                            <label for="end_date">Estimated Completion Date</label>
                            <input type="date" id="end_date" name="end_date">
                        </div>
                    </div>
                </section>

                <!-- Financial information -->
                <section class="card form-section">
                    <h2>Financial Information</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="budget">Estimated Budget ($)</label>
                            <input type="number" id="budget" name="budget" min="0" step="0.01" placeholder="e.g. 48500">
                        </div>
                    </div>
                </section>

                <!-- Status -->
                <section class="card form-section">
                    <h2>Status</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="status">Project Status</label>
                            <select id="status" name="status">
                                <option>Planning</option>
                                <option>In Progress</option>
                                <option>On Hold</option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Buttons -->
                <div class="form-actions">
                    <a href="{{ url_for('projects') }}" class="btn-outline">Cancel</a>
                    <button type="submit" class="btn">Create Project</button>
                </div>

            </form>
        </main>
    </div>
</div>
</body>
</html>
