<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Client | Buff Bison Construction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

    {% set active_page = 'clients' %}
    {% include '_sidebar.html' %}

    <div class="main">
        <header class="header">
            <div>
                <h1>Add New Client</h1>
                <p class="welcome">Enter contact and billing information for a client.</p>
            </div>
            <div class="header-right">
                <div class="profile">
                    <span class="avatar">{{ user_name[0] }}</span>
                    <span class="profile-name">{{ user_name }}</span>
                </div>
            </div>
        </header>

        <main class="content">
            <form method="POST" action="{{ url_for('new_client') }}" class="form-page">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <section class="card form-section">
                    <h2>Contact Information</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="client_name">Client Name <span class="required">*</span></label>
                            <input type="text" id="client_name" name="client_name" autocomplete="name" required>
                        </div>
                        <div class="form-field">
                            <label for="company">Company (optional)</label>
                            <input type="text" id="company" name="company" autocomplete="organization">
                        </div>
                        <div class="form-field">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" autocomplete="email">
                        </div>
                        <div class="form-field">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" autocomplete="tel">
                        </div>
                        <div class="form-field full">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" autocomplete="street-address">
                        </div>
                    </div>
                </section>

                <section class="card form-section">
                    <h2>Client Details</h2>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option selected>Active</option>
                                <option>Inactive</option>
                            </select>
                        </div>
                        <div class="form-field full">
                            <label for="notes">Notes (optional)</label>
                            <textarea id="notes" name="notes"></textarea>
                        </div>
                    </div>
                </section>

                <p class="welcome">Client submissions are not saved yet; database storage has not been connected.</p>

                <div class="form-actions">
                    <a href="{{ url_for('clients') }}" class="btn-outline">Cancel</a>
                    <button type="submit" class="btn">Save Client</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
